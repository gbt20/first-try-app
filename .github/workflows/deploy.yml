name: Build and deploy

on:
  push:
    branches:
      - main
      - claude/habit-tracker-app-tzew8h
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Project sites are served from /<repo>/, so the asset paths need that
        # prefix. Reading it from the repo name survives a rename.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages must already be enabled for the repository, with its source set
      # to GitHub Actions. The workflow token is not allowed to create the
      # Pages site itself, so that first step is a manual one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
